# Project list powering the home page.
# Add a new project = append an entry here + drop images in assets/images/<slug>/.
# `url` is the in-site marketing page (if present); `external_url` is a dedicated
# website (e.g. myvinyls.app). `app_store`, `google_play`, and `testflight`
# are optional download links shared by the home page and product pages.

- slug: myvinyl
  name: My Vinyl
  tagline: Your record collection, beautifully cataloged.
  description: >-
    Catalog and manage your vinyl records. Backed by Discogs, with
    collection stats, wantlist tracking, and sync across iPhone, iPad,
    and Mac.
  platforms: iOS, iPadOS, macOS, Android
  icon: /assets/images/myvinyl/icon.jpg
  show_icon: true
  icon_placeholder: "V"
  url: ""
  app_store: https://apps.apple.com/app/id1547173908
  google_play: https://play.google.com/store/apps/details?id=com.mcsoftware.myvinyl
  external_url: https://myvinyls.app

- slug: ridenav
  name: RideNav
  tagline: Motorcycle navigation built around the ride.
  description: >-
    Plan twisty motorcycle routes, record every ride, and keep the
    whole group together with live location sharing and on-route chat.
    Available on iPhone and Android, with a web planner.
  platforms: iOS, Android
  icon: /assets/images/ridenav/icon.png
  show_icon: true
  icon_placeholder: "R"
  url: /ridenav/
  app_store: ""
  testflight: https://testflight.apple.com/join/FfBfDhhB
  external_url: ""

- slug: mapink
  name: MapInk
  tagline: Draw and plan on real maps.
  description: >-
    Mark up Apple Maps with Pencil notes, pins, freehand distance
    sketches, and drive or walk routes through the places you save.
    Built for iPad map planning.
  platforms: iPadOS
  icon: /assets/images/mapink/icon.png
  show_icon: true
  icon_placeholder: "M"
  url: /mapink/
  app_store: https://apps.apple.com/app/apple-store/id6768144274
  external_url: ""

- slug: echoai
  name: EchoAI
  tagline: On-device meeting intelligence.
  description: >-
    Record a meeting or conversation. EchoAI transcribes in real time,
    summarizes, pulls out action items, and lets you search across every
    session — all on-device.
  platforms: iOS 26+
  icon: /assets/images/echoai/icon.jpg
  show_icon: true
  icon_placeholder: "E"
  url: /echoai/
  app_store: https://apps.apple.com/app/id6761034332
  external_url: ""

- slug: weekwise
  name: Weekwise
  tagline: The week ahead, nothing more.
  description: >-
    A forward-looking weekly calendar that doubles as a todo list. Shows
    the next seven days, syncs with iOS Calendar, surfaces the weather,
    and suggests prep steps before your events.
  platforms: iOS 26+
  icon: /assets/images/weekwise/icon.png
  show_icon: true
  icon_placeholder: "W"
  url: /weekwise/
  app_store: https://apps.apple.com/app/id6759658981
  external_url: ""
