<!doctype html>
<html lang="en">
  {%- include head.html -%}
  <body{% if page.store_gallery %} class="has-app-galleries"{% endif %}>
    {%- include header.html -%}
    <main id="main" class="site-main">
      {{ content }}
    </main>
    {%- include footer.html -%}

    {% endif %}
  </body>
</html>
