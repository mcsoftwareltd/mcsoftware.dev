---
layout: default
---
<article class="legal">
  <div class="container container--narrow">
    <p class="eyebrow">{{ page.project }} &nbsp;/&nbsp; {{ page.kind }}</p>
    <h1 class="page__title">{{ page.title }}</h1>
    {%- if page.effective_date -%}
    <p class="legal__effective">Effective {{ page.effective_date }}</p>
    {%- endif -%}
    <div class="prose legal__prose">
      {{ content }}
    </div>
    {%- if page.project_url -%}
    <p class="legal__back">
      <a href="{{ page.project_url | relative_url }}">&larr; Back to {{ page.project }}</a>
    </p>
    {%- endif -%}
  </div>
</article>
